<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOTR 4.2 – Demo Guide</title>
<style>
  :root {
    --blue: #2166CF; --navy: #003087; --magenta: #C8006C;
    --bg: #ffffff; --bg2: #f5f6f8; --bg3: #eef0f4;
    --text: #1a1a2e; --text2: #4a4a6a; --text3: #7a7a9a;
    --border: #dde1ea; --border2: #c8cdd8;
    --success-bg: #e8f5ee; --success-text: #0a6640; --success-border: #b8dfc8;
    --info-bg: #e8f0fb; --info-text: #1a4a9a; --info-border: #b8ccf0;
    --warn-bg: #fef6e4; --warn-text: #7a4a00; --warn-border: #f0d88a;
    --android-bg: #e8f5e9; --android-text: #1b5e20; --android-border: #a5d6a7;
    --shadow: 0 1px 4px rgba(0,0,0,0.08);
    --radius: 10px; --radius-sm: 6px;
  }

    :root {
      --bg: #0f1117; --bg2: #181b24; --bg3: #1e2230;
      --text: #e8eaf2; --text2: #a8aac2; --text3: #6a6c82;
      --border: #2a2e3e; --border2: #3a3e52;
      --success-bg: #0d2a1a; --success-text: #5cd98a; --success-border: #1a4a2a;
      --info-bg: #0d1a38; --info-text: #7ab0ff; --info-border: #1a2a50;
      --warn-bg: #2a1e08; --warn-text: #f0c060; --warn-border: #4a3010;
      --android-bg: #0d2010; --android-text: #80d880; --android-border: #1a3a1a;
      --shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; }
  
  /* Header */
  .header { background: var(--navy); color: #fff; padding: 20px 24px 16px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .header-title { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
  .header-sub { font-size: 12px; opacity: 0.7; margin-top: 2px; }
  .lang-switcher { display: flex; gap: 4px; }
  .lang-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 5px 12px; border-radius: 16px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.15s; }
  .lang-btn:hover { background: rgba(255,255,255,0.22); }
  .lang-btn.active { background: var(--magenta); border-color: var(--magenta); }

  /* Nav pills */
  .toc-bar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; gap: 6px; flex-wrap: wrap; overflow-x: auto; }
  .toc-pill { background: var(--bg); border: 1px solid var(--border); color: var(--text2); padding: 5px 12px; border-radius: 14px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.15s; white-space: nowrap; }
  .toc-pill:hover { border-color: var(--blue); color: var(--blue); }

  /* Main layout */
  .main { max-width: 900px; margin: 0 auto; padding: 20px 20px 60px; }
  .intro-box { background: var(--info-bg); border: 1px solid var(--info-border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 24px; font-size: 13px; color: var(--info-text); line-height: 1.6; }

  /* Sections */
  .section { margin-bottom: 32px; }
  .section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; cursor: pointer; user-select: none; }
  .section-icon { font-size: 20px; width: 32px; text-align: center; }
  .section-title { font-size: 16px; font-weight: 700; color: var(--text); flex: 1; }
  .section-badges { display: flex; gap: 5px; flex-wrap: wrap; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; letter-spacing: 0.3px; }
  .badge-web { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
  .badge-admin { background: var(--info-bg); color: var(--info-text); border: 1px solid var(--info-border); }
  .badge-android { background: var(--android-bg); color: var(--android-text); border: 1px solid var(--android-border); }
  .badge-both { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }
  .chevron { color: var(--text3); font-size: 12px; transition: transform 0.2s; }
  .chevron.open { transform: rotate(180deg); }
  .divider { height: 1px; background: var(--border); margin-bottom: 12px; }

  /* Cards */
  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 600px) { .card-grid { grid-template-columns: 1fr; } }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; transition: border-color 0.15s, background 0.15s, box-shadow 0.15s; }
  .card:hover { border-color: var(--blue); background: var(--bg2); box-shadow: var(--shadow); }
  .card.active { border-color: var(--blue); background: var(--bg2); }
  .card-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .card-desc { font-size: 12px; color: var(--text2); line-height: 1.5; }
  .tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; }
  .tag-web { background: var(--success-bg); color: var(--success-text); }
  .tag-admin { background: var(--info-bg); color: var(--info-text); }
  .tag-android { background: var(--android-bg); color: var(--android-text); }

  /* Detail panel */
  .detail { display: none; background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius); padding: 16px; margin-top: 10px; }
  .detail.open { display: block; }
  .detail h3 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 10px; }
  .detail ul { padding-left: 18px; margin-bottom: 10px; }
  .detail ul li { font-size: 13px; color: var(--text2); line-height: 1.7; margin-bottom: 2px; }
  .detail ul li strong { color: var(--text); font-weight: 700; }
  .demo-tip { background: var(--warn-bg); border: 1px solid var(--warn-border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12px; color: var(--warn-text); line-height: 1.6; margin-top: 8px; }
  .demo-tip strong { font-weight: 700; }
  .android-note { background: var(--android-bg); border: 1px solid var(--android-border); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12px; color: var(--android-text); line-height: 1.6; margin-top: 8px; }
  .android-note strong { font-weight: 700; }

  /* SharePoint tip box */
  .sharepoint-box { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 24px; font-size: 12px; color: var(--text2); }
  .sharepoint-box strong { color: var(--text); }

  /* Footer */
  .footer { text-align: center; padding: 20px; font-size: 11px; color: var(--text3); border-top: 1px solid var(--border); margin-top: 20px; }

  /* Tab system */
  .tab-bar { display: flex; gap: 0; margin-bottom: 12px; border-bottom: 2px solid var(--border); }
  .tab-btn { background: none; border: none; padding: 7px 14px; font-size: 12px; font-weight: 700; color: var(--text3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color .15s, border-color .15s; }
  .tab-btn:hover { color: var(--text2); }
  .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }
  /* Demo script blocks */
  .demo-block { margin-bottom: 12px; }
  .demo-block-head { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
  .demo-block-icon { font-size: 14px; }
  .demo-steps { list-style: none; padding: 0; margin: 0; }
  .demo-steps li { font-size: 12px; color: var(--text2); line-height: 1.6; padding: 4px 0 4px 20px; border-left: 2px solid var(--border); margin-left: 6px; margin-bottom: 2px; position: relative; }
  .demo-steps li::before { content: attr(data-n); position: absolute; left: -10px; top: 3px; font-size: 10px; font-weight: 700; color: var(--blue); background: var(--bg); line-height: 1; }
  .demo-note { background: var(--android-bg); border: 1px solid var(--android-border); border-radius: var(--radius-sm); padding: 8px 10px; font-size: 11px; color: var(--android-text); margin-top: 6px; }

</style>
</head>

let currentLang = 'fr';
let openCard = null;

function setLang(lang) {
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
  document.documentElement.lang = lang;
  renderAll();
}

function badgeHTML(type) {
  const labels = {
    fr: { web:'WebChat', admin:'Admin', android:'Android', both:'Admin+WebChat' },
    nl: { web:'WebChat', admin:'Admin', android:'Android', both:'Admin+WebChat' },
    en: { web:'WebChat', admin:'Admin', android:'Android', both:'Admin+WebChat' }
  };
  return `<span class="badge badge-${type}">${labels[currentLang][type]||type}</span>`;
}

function tagHTML(type) {
  const labels = { web:'WebChat', admin:'Admin', android:'Android' };
  return `<span class="tag tag-${type}">${labels[type]||type}</span>`;
}

function renderAll() {
  const t = T[currentLang];
  document.getElementById('h-title').textContent = t.title;
  document.getElementById('h-sub').textContent = t.sub;
  document.getElementById('intro-box').textContent = t.intro;

  const sections = t.sections;
  const toc = document.getElementById('toc-bar');
  toc.innerHTML = '';
  sections.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'toc-pill';
    btn.textContent = s.icon + ' ' + s.title;
    btn.onclick = () => document.getElementById('s'+i).scrollIntoView({behavior:'smooth', block:'start'});
    toc.appendChild(btn);
  });

  const container = document.getElementById('sections-container');
  container.innerHTML = '';
  sections.forEach((s, si) => {
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.id = 's'+si;

    const badges = s.badges.map(b => badgeHTML(b)).join('');
    sec.innerHTML = `
      <div class="section-head" onclick="toggleSection(${si})">
        <span class="section-icon">${s.icon}</span>
        <span class="section-title">${s.title}</span>
        <span class="section-badges">${badges}</span>
        <span class="chevron open" id="ch${si}">▼</span>
      </div>
      <div class="divider"></div>
      <div class="card-grid" id="grid${si}"></div>
    `;
    container.appendChild(sec);

    const grid = sec.querySelector('.card-grid');
    s.cards.forEach((c) => {
      const tags = c.tags.map(t => tagHTML(t)).join('');
      const bullets = c.bullets.map(b => `<li>${b}</li>`).join('');
      const tip = c.tip ? `<div class="demo-tip"><strong>${T[currentLang].demotip} :</strong> ${c.tip}</div>` : '';
      const anote = c.android ? `<div class="android-note"><strong>${T[currentLang].androidnote} :</strong> ${c.android}</div>` : '';

      const card = document.createElement('div');
      card.className = 'card';
      card.id = 'card-'+c.id;
      card.innerHTML = `<div class="card-title">${tags} ${c.title}</div><div class="card-desc">${c.desc}</div>`;
      card.onclick = () => openDetail(c.id, c.h3, bullets, tip, anote);
      grid.appendChild(card);
    });

    // Detail panel placeholder after grid
    const detail = document.createElement('div');
    detail.className = 'detail';
    detail.id = 'det-placeholder-'+si;
    sec.appendChild(detail);
  });
}

    nl: {context:'Er is een incident op een specifiek adres. De dispatcher moet de dichtstbijzijnde beschikbare agent identificeren en direct inzetten.',admin:['Zorg dat realtime tracking is ingeschakeld voor veldagenten (zie geo1)'],webchat:['WebChat → tabblad Kaart met zichtbare agenten'],playout:['Dispatcher voert een adres in de zoekbalk van de kaart in','De kaart centreert op die locatie, de afstanden van elke agent worden weergegeven','Filteren op status \'Beschikbaar\' om vrije agenten te identificeren','Klikken op de pin van de dichtstbijzijnde agent → PTT vanuit de pin','De agent ontvangt de PTT-oproep direct'],note:'Android: de dichtstbijzijnde contactpersoon bij het gezochte adres verschijnt als eerste in de detaillijst.'},
    en: {context:'An incident occurs at a specific address. The dispatcher needs to identify the nearest available agent and deploy them immediately.',admin:['Ensure real-time tracking is enabled for field agents (see geo1)'],webchat:['WebChat → Map tab with agents visible'],playout:['Dispatcher types an address in the map search bar','Map centres on that location, distances from each agent are displayed','Filter by \'Available\' status to identify free agents','Click the nearest agent\'s pin → PTT from the pin','Agent receives the PTT call directly'],note:'Android: the contact closest to the searched address appears first in the details list.'},

  "geo3": {
    fr: {context:'L\'admin veut adapter la consommation batterie et données selon le type de travailleur — suivi continu pour les chauffeurs, à la demande pour les techniciens en atelier.',admin:['Profil utilisateur → Géolocalisation → choisir le mode (À la demande / Suivi / Distance)','Pour le mode Suivi : définir la fréquence (ex. toutes les 30s)','Pour le mode Distance : définir le seuil (ex. 100m)','Bloquer la modification par l\'utilisateur si souhaité (verrou)'],webchat:[],playout:['Montrer deux profils côte à côte : Chauffeur (Suivi 30s) vs Technicien (À la demande)','Sur la carte, montrer que le chauffeur se déplace en temps réel, le technicien reste statique','Dispatcher clique \'Actualiser\' sur le technicien → la position se met à jour','Montrer les niveaux de stockage (Faible / Moyen / Élevé) et expliquer le compromis'],note:'Android : l\'utilisateur voit son mode de suivi actuel dans Plus > Paramètres > Géolocalisation (si non verrouillé).'},
    nl: {context:'De admin wil batterij- en dataverbruik aanpassen aan het type werker — continu tracking voor chauffeurs, op aanvraag voor technici in de werkplaats.',admin:['Gebruikersprofiel → Geolokalisatie → modus kiezen (Op aanvraag / Tracking / Afstand)','Voor Tracking-modus: frequentie instellen (bijv. elke 30s)','Voor Afstand-modus: drempel instellen (bijv. 100m)','Wijziging door gebruiker blokkeren indien gewenst (vergrendeling)'],webchat:[],playout:['Twee profielen naast elkaar tonen: Chauffeur (Tracking 30s) vs Technicus (Op aanvraag)','Op de kaart tonen dat de chauffeur in realtime beweegt, de technicus statisch blijft','Dispatcher klikt \'Vernieuwen\' op de technicus → de positie wordt bijgewerkt','Opslagladers tonen (Laag / Gemiddeld / Hoog) en het compromis uitleggen'],note:'Android: de gebruiker ziet zijn huidige trackingmodus in Meer > Instellingen > Geolokalisatie (indien niet vergrendeld).'},
    en: {context:'The admin wants to adapt battery and data usage depending on the type of worker — continuous tracking for drivers, on-demand for workshop technicians.',admin:['User profile → Geolocation → choose mode (On-demand / Tracking / Distance)','For Tracking mode: set frequency (e.g. every 30s)','For Distance mode: set threshold (e.g. 100m)','Block user modification if desired (lock)'],webchat:[],playout:['Show two profiles side by side: Driver (Tracking 30s) vs Technician (On-demand)','On the map, show that the driver moves in real time, the technician stays static','Dispatcher clicks \'Refresh\' on the technician → position updates','Show storage levels (Low / Medium / High) and explain the trade-off'],note:'Android: the user sees their current tracking mode in More > Settings > Geolocation (if not locked).'},
  },
  "geo4": {
    fr: {context:'Un site industriel ou un hôpital a des zones souterraines ou bâtiments où le GPS ne fonctionne pas. Les beacons permettent de localiser les agents à l\'intérieur.',admin:['Admin → Mes Outils → Géolocalisation Intérieure par Beacon','Ajouter chaque beacon (nom, identifiant UUID, position sur le plan)','Activer le suivi beacon dans le profil des utilisateurs concernés'],webchat:['WebChat → Carte → vérifier que le plan indoor est visible'],playout:['Montrer la liste des beacons dans l\'admin avec leurs emplacements','Activer le Bluetooth + \'Détection Beacon\' sur le téléphone Android de démo','Se déplacer près d\'un beacon → observer la position sur la carte WebChat qui bascule de GPS à beacon','Montrer la précision (~2-3m) vs GPS qui ne fonctionnerait pas à cet endroit'],note:'Android : activer dans Plus > Paramètres > Options > Beacon. Si GPS et beacon sont actifs, la position beacon a la priorité.'},
    nl: {context:'Een industriële site of ziekenhuis heeft ondergrondse zones of gebouwen waar GPS niet werkt. Beacons stellen in staat agenten binnenin te lokaliseren.',admin:['Admin → Mijn Tools → Indoor Geolokalisatie via Beacon','Elke beacon toevoegen (naam, UUID-identificatie, positie op het plan)','Beacon-tracking inschakelen in het profiel van de betrokken gebruikers'],webchat:['WebChat → Kaart → controleren of het indoor plan zichtbaar is'],playout:['De lijst met beacons in de admin tonen met hun locaties','Bluetooth + \'Beacon-detectie\' activeren op de Android-demotelefooon','Bewegen naar een beacon → observeren hoe de positie op de WebChat-kaart overschakelt van GPS naar beacon','De nauwkeurigheid tonen (~2-3m) vs GPS die op die locatie niet zou werken'],note:'Android: activeren in Meer > Instellingen > Opties > Beacon. Als GPS en beacon actief zijn, heeft de beacon-positie prioriteit.'},
    en: {context:'An industrial site or hospital has underground zones or buildings where GPS does not work. Beacons allow agents to be located indoors.',admin:['Admin → My Tools → Indoor Geolocation via Beacon','Add each beacon (name, UUID identifier, position on the floor plan)','Enable beacon tracking in the profile of the relevant users'],webchat:['WebChat → Map → verify that the indoor plan is visible'],playout:['Show the list of beacons in admin with their locations','Enable Bluetooth + \'Beacon detection\' on the demo Android phone','Move near a beacon → observe the position on the WebChat map switching from GPS to beacon','Show the precision (~2-3m) vs GPS which would not work at that location'],note:'Android: enable in More > Settings > Options > Beacon. If GPS and beacon are both active, beacon position takes priority.'},
  },
  "msg1": {

    en: {context:'A dispersed team needs a visual meeting with document sharing and annotations — without an external tool.',admin:['Ensure the Rooms feature is enabled for the organisation'],webchat:['WebChat → Contacts → Create a new Room or open an existing one'],playout:['Dispatcher opens a Room from WebChat and shares the link via message','Android user joins the Room from the received link','Dispatcher enables screen sharing (e.g. site plan)','Dispatcher opens the Whiteboard → draws an intervention area','Enable restricted access room → a third user attempts to enter → dispatcher approves from the banner'],note:'Android: mobile participants can also annotate on the whiteboard from their phone.'},

    nl: {context:'Een teamleider stuurt een veiligheidsinstructie en moet er zeker van zijn dat alle agenten deze hebben gelezen en begrepen.',admin:['Een groepsgesprek aanmaken met alle betrokken agenten'],webchat:['WebChat → Gesprekken → groep openen'],playout:['Dispatcher stuurt een tekstbericht naar de groep + bijlage (bijv. procedure-PDF)','Klikken op \'Bevestiging vragen\' in de berichtopties','Op Android-telefoons: agenten ontvangen het bericht met de knop Bevestigen','Elke agent bevestigt → dispatcher ziet de bevestigingen in realtime verschijnen','De bezorgstatus tonen: verzonden → bezorgd → gelezen voor elke agent','Berichtzoeken tonen: zoeken naar een trefwoord in alle gesprekken'],note:'Android: conceptmodus — de app verlaten tijdens het typen slaat het bericht automatisch op.'},
    en: {context:'A team leader sends a safety instruction and needs to ensure all agents have read and understood it.',admin:['Create a group conversation including all relevant agents'],webchat:['WebChat → Conversations → open the group'],playout:['Dispatcher sends a text message to the group + attachment (e.g. procedure PDF)','Click \'Request Confirmation\' in the message options','On Android phones: agents receive the message with the Confirm button','Each agent confirms → dispatcher sees acknowledgements appearing in real time','Show delivery status: sent → delivered → read for each agent','Show message search: search for a keyword across all conversations'],note:'Android: draft mode — leaving the app while typing auto-saves the message.'},

  "msg3": {
    fr: {context:'Un sous-traitant temporaire doit être ajouté rapidement à une communication sans créer un compte complet dans l\'organisation.',admin:['Vérifier les droits d\'invitation dans le profil de l\'utilisateur invitant (autorisation \'Inviter des invités\')'],webchat:['WebChat → Contacts → Inviter un invité'],playout:['Dispatcher clique \'Inviter un invité\' → génère un lien d\'invitation','Envoyer le lien par SMS au téléphone de démo externe','L\'invité télécharge l\'app et rejoint automatiquement','Montrer que l\'invité ne voit que l\'invitant et la conversation partagée (pas l\'annuaire complet)','Comparer avec un utilisateur org standard qui voit tous les contacts'],note:'Android : l\'invitation peut aussi être envoyée directement depuis une conversation existante.'},
    nl: {context:'Een tijdelijke aannemer moet snel worden toegevoegd aan communicatie zonder een volledig account in de organisatie aan te maken.',admin:['De uitnodigingsrechten verifiëren in het profiel van de uitnodigende gebruiker (toestemming \'Gasten uitnodigen\')'],webchat:['WebChat → Contacten → Gast uitnodigen'],playout:['Dispatcher klikt \'Gast uitnodigen\' → genereert een uitnodigingslink','De link via SMS sturen naar de externe demotelefooon','De gast downloadt de app en joiner automatisch','Tonen dat de gast alleen de uitnodiger en het gedeelde gesprek ziet (niet de volledige directory)','Vergelijken met een standaard org-gebruiker die alle contacten ziet'],note:'Android: de uitnodiging kan ook direct worden verzonden vanuit een bestaand gesprek.'},
    en: {context:'A temporary contractor needs to be quickly added to communications without creating a full account in the organisation.',admin:['Verify invitation rights in the inviting user\'s profile (permission \'Invite guests\')'],webchat:['WebChat → Contacts → Invite a guest'],playout:['Dispatcher clicks \'Invite a guest\' → generates an invitation link','Send the link by SMS to the external demo phone','Guest downloads the app and joins automatically','Show that the guest only sees the inviting user and the shared conversation (not the full directory)','Compare with a standard org user who sees all contacts'],note:'Android: the invitation can also be sent directly from an existing conversation.'},

  "msg4": {

    nl: {context:'Verspreide teams bellen regelmatig met elkaar. Het doel is te tonen dat deze oproepen geen GSM-minuten verbruiken.',admin:['Controleren of VoIP is geactiveerd in de gebruikersprofielen'],webchat:['WebChat → Kiezer (telefoonpictogram)'],playout:['Dispatcher opent de WebChat Kiezer → kiest het interne TOTR-nummer van een agent','VoIP-oproep wordt opgezet — tonen dat er geen GSM-minuten worden verbruikt','Overschakelen naar video-oproep vanuit het oproepinterface','Dispatcher kiest een extern nummer (PSTN) → het verschil tonen','Op Android: gespreksfusie tonen (een derde deelnemer toevoegen)'],note:'Android: WebChat-sneltoetsen — CTRL+SHIFT+PgUp om te beantwoorden, CTRL+SHIFT+PgDn om te weigeren.'},
    en: {context:'Dispersed teams regularly call each other. The goal is to show that these calls do not consume GSM minutes.',admin:['Verify that VoIP is enabled in user profiles'],webchat:['WebChat → Dialler (phone icon)'],playout:['Dispatcher opens the WebChat Dialler → dials an agent\'s internal TOTR number','VoIP call is established — show that no GSM minutes are consumed','Switch to video call from the call interface','Dispatcher dials an external (PSTN) number → show the difference','On Android: show call merge (add a third participant)'],note:'Android: WebChat keyboard shortcuts — CTRL+SHIFT+PgUp to answer, CTRL+SHIFT+PgDn to reject.'},

  "mb1": {
    fr: {context:'Un client utilise encore des formulaires papier pour les inspections de sécurité. L\'objectif est de digitaliser ce processus avec validation par étapes et rapport automatique.',admin:['Admin → My Business → Nouveau Processus','Étape 1 (Détails) : nommer le processus, choisir le département','Étape 2 (Workflow) : créer 3 étapes (Arrivée sur site / Inspection / Validation)','Étape 3 (Contenu) : ajouter widgets — Texte (observations), Photo, GPS, Signature','Étape 4 (Routage) : définir qui valide chaque étape','Étape 5 (Publication) : assigner aux utilisateurs terrain','Étape 6 (Activation) : activer le processus'],webchat:[],playout:['Montrer le processus créé dans Admin avec ses 3 étapes et ses widgets','Sur Android : l\'agent voit le processus dans My Business → Démarrer','L\'agent remplit étape 1 (texte + GPS automatique)','L\'agent prend une photo dans étape 2','L\'agent signe dans étape 3 → soumet','Retour sur WebChat : superviseur voit le rapport complété','Télécharger le rapport PDF depuis WebChat'],note:'Android : widget Démarrer-Arrêter enregistre automatiquement la durée et les positions de début et fin.'},
    nl: {context:'Een klant gebruikt nog papieren formulieren voor veiligheidsinspecties. Het doel is dit proces te digitaliseren met stapsgewijze validatie en automatisch rapport.',admin:['Admin → My Business → Nieuw Proces','Stap 1 (Details): het proces benoemen, het afdeling kiezen','Stap 2 (Workflow): 3 stappen aanmaken (Aankomst op locatie / Inspectie / Validatie)','Stap 3 (Inhoud): widgets toevoegen — Tekst (observaties), Foto, GPS, Handtekening','Stap 4 (Routering): bepalen wie elke stap valideert','Stap 5 (Publicatie): toewijzen aan veldgebruikers','Stap 6 (Activering): het proces activeren'],webchat:[],playout:['Het aangemaakte proces in Admin tonen met zijn 3 stappen en widgets','Op Android: de agent ziet het proces in My Business → Starten','De agent vult stap 1 in (tekst + automatische GPS)','De agent neemt een foto in stap 2','De agent ondertekent in stap 3 → verzendt','Terug naar WebChat: supervisor ziet het ingevulde rapport','Het PDF-rapport downloaden vanuit WebChat'],note:'Android: Start-Stop widget registreert automatisch de duur en begin- en eindposities.'},
    en: {context:'A customer still uses paper forms for safety inspections. The goal is to digitalise this process with step-by-step validation and automatic reporting.',admin:['Admin → My Business → New Process','Step 1 (Details): name the process, choose the department','Step 2 (Workflow): create 3 steps (Arrival on site / Inspection / Sign-off)','Step 3 (Content): add widgets — Text (observations), Photo, GPS, Signature','Step 4 (Routing): define who validates each step','Step 5 (Publication): assign to field users','Step 6 (Activation): activate the process'],webchat:[],playout:['Show the created process in Admin with its 3 steps and widgets','On Android: agent sees the process in My Business → Start','Agent fills in step 1 (text + automatic GPS)','Agent takes a photo in step 2','Agent signs in step 3 → submits','Back on WebChat: supervisor sees the completed report','Download the PDF report from WebChat'],note:'Android: Start-Stop widget automatically records the duration and start and end positions.'},
  },
  "mb2": {

    nl: {context:'Een supervisor wil de voortgang van een lopende inspectie in realtime volgen vanaf zijn bureau, zonder elke agent te bellen.',admin:['Bestaand en gepubliceerd proces (zie mb1)'],webchat:['WebChat → My Business → het actieve proces selecteren'],playout:['Agent start het proces op Android','Op WebChat: de supervisor ziet de activiteit in realtime overgaan van \'Nieuw\' naar \'Bezig\'','Agent voltooit stap 1 → WebChat werkt de voortgang onmiddellijk bij','Agent voltooit alle stappen → status gaat naar \'Afgerond\'','WebChat: klikken op Rapport → een volledig rapport genereren → als PDF downloaden'],note:'Android: de agent kan ook een bericht sturen of de supervisor direct bellen vanuit het lopende proces.'},
    en: {context:'A supervisor wants to track the progress of an ongoing inspection in real time from their desk, without calling each agent.',admin:['Existing and published process (see mb1)'],webchat:['WebChat → My Business → select the active process'],playout:['Agent starts the process on Android','On WebChat: supervisor sees activity change from \'New\' to \'In Progress\' in real time','Agent completes step 1 → WebChat updates progress immediately','Agent completes all steps → status changes to \'Finalised\'','WebChat: click Report → generate a full report → download as PDF'],note:'Android: the agent can also send a message or call the supervisor directly from the running process.'},

    fr: {context:'Le client utilise déjà un ERP ou une GMAO. L\'objectif est de montrer que TOTR s\'intègre dans l\'outil existant sans le remplacer.',admin:['Admin → My Business → Nouveau Processus','À l\'étape Contenu : ajouter un widget \'URL\' et coller l\'URL de la GMAO ou d\'un intranet de démo'],webchat:['WebChat → My Business → ouvrir le processus'],playout:['Sur Android : l\'agent ouvre le processus → clique sur le widget URL','L\'URL GMAO s\'ouvre dans l\'app TOTR (sans quitter l\'app)','Sur WebChat : le processus affiche un bouton qui ouvre le même lien','Montrer que l\'agent peut toujours communiquer en PTT depuis le processus'],note:'Utiliser une URL publique (ex. intranet de démo ou page web simple) si la GMAO client n\'est pas accessible.'},

    en: {context:'The customer already uses an ERP or CMMS. The goal is to show that TOTR integrates with the existing tool without replacing it.',admin:['Admin → My Business → New Process','In the Content step: add a \'URL\' widget and paste the CMMS or demo intranet URL'],webchat:['WebChat → My Business → open the process'],playout:['On Android: agent opens the process → clicks the URL widget','The CMMS URL opens inside the TOTR app (without leaving the app)','On WebChat: the process shows a button that opens the same link','Show that the agent can still communicate via PTT from within the process'],note:'Use a public URL (e.g. demo intranet or simple web page) if the customer\'s CMMS is not accessible.'},

  "lw1": {
    fr: {context:'Un agent de sécurité travaille seul sur un site. Si une chute est détectée, le dispatcher doit être alerté automatiquement avec la position de l\'agent.',admin:['Admin → Protection du Travailleur Isolé → Nouveau profil PTI','Définir l\'angle de détection (ex. 60°) et le délai (ex. 5 secondes)','Configurer la liste de destinataires (dispatcher)','Activer la Sécurité Positive si souhaité (alerte si déconnexion réseau)'],webchat:['WebChat ouvert, onglet Conversations visible'],playout:['Activer le PTI sur le téléphone Android de démo (Plus > Paramètres > PTI > Activer)','Poser le téléphone à plat (simule une chute)','Observer le compte à rebours de la pré-alerte sur l\'écran Android (son + visuel)','NE PAS annuler → l\'alerte est envoyée après le délai','Sur WebChat : pop-up rouge apparaît avec nom, position, boutons (Localiser / Appeler / Message)','Cliquer sur Localiser → carte s\'ouvre sur la position de l\'agent','Appel VoIP automatique vers l\'agent → haut-parleur activé automatiquement'],note:'Android : l\'étalonnage de l\'angle est automatique à l\'ouverture de l\'app. Ne pas secouer le téléphone pendant l\'étalonnage.'},
    nl: {context:'Een beveiligingsagent werkt alleen op een site. Als een val wordt gedetecteerd, moet de dispatcher automatisch worden gealarmeerd met de positie van de agent.',admin:['Admin → Bescherming Alleenwerkende → Nieuw PTI-profiel','De detectiehoek instellen (bijv. 60°) en de vertraging (bijv. 5 seconden)','De ontvangerlijst configureren (dispatcher)','Positieve veiligheid activeren indien gewenst (alert bij netwerkverlies)'],webchat:['WebChat geopend, tabblad Gesprekken zichtbaar'],playout:['PTI activeren op de Android-demonstratietelefooon (Meer > Instellingen > PTI > Activeren)','De telefoon plat neerleggen (simuleert een val)','Het aftellen van de pre-alarm op het Android-scherm observeren (geluid + visueel)','NIET annuleren → de alert wordt na de vertraging verzonden','Op WebChat: rode pop-up verschijnt met naam, positie, knoppen (Lokaliseren / Bellen / Bericht)','Klikken op Lokaliseren → kaart opent op de positie van de agent','Automatische VoIP-oproep naar de agent → luidspreker automatisch geactiveerd'],note:'Android: de hoekkalibratie is automatisch bij het openen van de app. Schud de telefoon niet tijdens de kalibratie.'},
    en: {context:'A security agent is working alone on a site. If a fall is detected, the dispatcher must be automatically alerted with the agent\'s position.',admin:['Admin → Lone Worker Protection → New LWP profile','Set the detection angle (e.g. 60°) and the delay (e.g. 5 seconds)','Configure the recipient list (dispatcher)','Enable Positive Safety if desired (alert if network disconnects)'],webchat:['WebChat open, Conversations tab visible'],playout:['Enable LWP on the demo Android phone (More > Settings > LWP > Activate)','Lay the phone flat (simulates a fall)','Observe the pre-alarm countdown on the Android screen (sound + visual)','Do NOT cancel → the alert is sent after the delay','On WebChat: red pop-up appears with name, position, buttons (Locate / Call / Message)','Click Locate → map opens on the agent\'s position','Automatic VoIP call to the agent → speakerphone automatically activated'],note:'Android: angle calibration is automatic when the app opens. Do not shake the phone during calibration.'},
  },
  "lw2": {
    fr: {context:'L\'organisation a deux types de travailleurs isolés avec des risques différents : agents de sécurité (haute sensibilité) et techniciens de maintenance (sensibilité standard).',admin:['Admin → Protection du Travailleur Isolé → créer Profil 1 \'Sécurité\' (angle 45°, délai 3s)','Créer Profil 2 \'Maintenance\' (angle 65°, délai 8s)','Assigner Profil 1 aux agents sécurité, Profil 2 aux techniciens','Activer \'Verrouiller les paramètres\' pour empêcher la modification par les utilisateurs'],webchat:[],playout:['Montrer les deux profils dans Admin avec leurs paramètres différents','Modifier l\'angle du Profil 1 → montrer que tous les agents sécurité assignés sont affectés immédiatement','Tester les deux profils avec le téléphone : profil sensible détecte plus tôt','Montrer la Sécurité Positive : couper le WiFi/données → après le délai, une alerte est envoyée même sans chute'],note:'Android : Plus > Paramètres > PTI → l\'utilisateur voit les paramètres mais ne peut pas les modifier si verrouillé.'},
    nl: {context:'De organisatie heeft twee soorten alleenwerkende medewerkers met verschillende risico\'s: beveiligingsagenten (hoge gevoeligheid) en onderhoudstechnici (standaard gevoeligheid).',admin:['Admin → Bescherming Alleenwerkende → Profiel 1 \'Beveiliging\' aanmaken (hoek 45°, vertraging 3s)','Profiel 2 \'Onderhoud\' aanmaken (hoek 65°, vertraging 8s)','Profiel 1 toewijzen aan beveiligingsagenten, Profiel 2 aan technici','\'Instellingen vergrendelen\' activeren om wijzigingen door gebruikers te voorkomen'],webchat:[],playout:['Beide profielen tonen in Admin met hun verschillende parameters','De hoek van Profiel 1 wijzigen → tonen dat alle toegewezen beveiligingsagenten onmiddellijk worden beïnvloed','Beide profielen testen met de telefoon: gevoelig profiel detecteert eerder','Positieve veiligheid tonen: WiFi/data uitschakelen → na de vertraging wordt een alert verzonden, zelfs zonder val'],note:'Android: Meer > Instellingen > PTI → de gebruiker ziet de parameters maar kan ze niet wijzigen als ze zijn vergrendeld.'},
    en: {context:'The organisation has two types of lone workers with different risk levels: security agents (high sensitivity) and maintenance technicians (standard sensitivity).',admin:['Admin → Lone Worker Protection → create Profile 1 \'Security\' (angle 45°, delay 3s)','Create Profile 2 \'Maintenance\' (angle 65°, delay 8s)','Assign Profile 1 to security agents, Profile 2 to technicians','Enable \'Lock settings\' to prevent modification by users'],webchat:[],playout:['Show both profiles in Admin with their different parameters','Modify the angle of Profile 1 → show that all assigned security agents are immediately affected','Test both profiles with the phone: sensitive profile detects earlier','Show Positive Safety: cut WiFi/data → after the delay, an alert is sent even without a fall'],note:'Android: More > Settings > LWP → the user sees the parameters but cannot modify them if locked.'},
  },
  "sr1": {
    fr: {context:'Un agent de sécurité effectue une ronde de nuit sur un site industriel. Le superviseur doit s\'assurer que tous les points sont contrôlés dans les délais.',admin:['Admin → Mes Outils → Itinéraires de Surveillance → Nouveau','Étape 1 : nommer l\'itinéraire, définir la durée totale (ex. 45 minutes)','Étape 2 : ajouter 3–4 points de contrôle NFC (nommer chaque point)','Étape 3 : activer la séquence obligatoire + délai max entre points (ex. 10 min)','Étape 4 : assigner à l\'agent de démo','Étape 5 : activer et générer le rapport automatique'],webchat:['WebChat → Mes Outils → Itinéraires (si disponible dans la vue superviseur)'],playout:['Agent démarre la ronde sur Android → scanne le tag NFC du point 1','Agent scanne le point 2 dans les temps → l\'app guide vers le prochain point','Agent saute volontairement le point 3 → après le délai, une alerte TOTR est envoyée au superviseur','Superviseur voit l\'alerte dans WebChat / Conversations','Agent scanne le point 4 → termine la ronde','Admin → Rapport → générer le rapport d\'exception → montrer la ligne du point 3 manqué'],note:'Les tags NFC doivent être programmés au préalable avec un identifiant unique. Utiliser des tags NFC bon marché disponibles en ligne.'},
    nl: {context:'Een beveiligingsagent voert een nachtronde uit op een industriële site. De supervisor moet ervoor zorgen dat alle punten tijdig worden gecontroleerd.',admin:['Admin → Mijn Tools → Bewakingsroutes → Nieuw','Stap 1: de route benoemen, de totale duur instellen (bijv. 45 minuten)','Stap 2: 3–4 NFC-controlepunten toevoegen (elk punt benoemen)','Stap 3: verplichte volgorde activeren + max vertraging tussen punten (bijv. 10 min)','Stap 4: toewijzen aan de demo-agent','Stap 5: activeren en automatisch rapport instellen'],webchat:['WebChat → Mijn Tools → Routes (indien beschikbaar in de supervisorweergave)'],playout:['Agent start de ronde op Android → scant de NFC-tag van punt 1','Agent scant punt 2 op tijd → de app begeleidt naar het volgende punt','Agent slaat bewust punt 3 over → na de vertraging wordt een TOTR-alert naar de supervisor verstuurd','Supervisor ziet de alert in WebChat / Gesprekken','Agent scant punt 4 → beëindigt de ronde','Admin → Rapport → uitzonderingsrapport genereren → de regel van het gemiste punt 3 tonen'],note:'NFC-tags moeten vooraf worden geprogrammeerd met een unieke identificatie. Gebruik goedkope NFC-tags die online beschikbaar zijn.'},
    en: {context:'A security agent performs a night patrol on an industrial site. The supervisor needs to ensure all checkpoints are covered within the time limits.',admin:['Admin → My Tools → Surveillance Routes → New','Step 1: name the route, define the total duration (e.g. 45 minutes)','Step 2: add 3–4 NFC checkpoints (name each point)','Step 3: enable required sequence + max delay between points (e.g. 10 min)','Step 4: assign to the demo agent','Step 5: activate and set up automatic report'],webchat:['WebChat → My Tools → Routes (if available in the supervisor view)'],playout:['Agent starts the patrol on Android → scans the NFC tag at checkpoint 1','Agent scans checkpoint 2 on time → app guides to the next point','Agent intentionally skips checkpoint 3 → after the delay, a TOTR alert is sent to the supervisor','Supervisor sees the alert in WebChat / Conversations','Agent scans checkpoint 4 → completes the patrol','Admin → Report → generate the exception report → show the line for the missed checkpoint 3'],note:'NFC tags must be pre-programmed with a unique identifier. Use cheap NFC tags available online.'},
  },
  "sr2": {
    fr: {context:'Le responsable de site veut consulter les rapports de rondes des dernières 48h et vérifier si des points ont été manqués ou si des délais ont été dépassés.',admin:['S\'assurer que l\'itinéraire est actif et que des rondes ont été effectuées (voir sr1)'],webchat:[],playout:['Admin → Mes Outils → Itinéraires → Rapports','Filtrer par itinéraire + plage de dates','Ouvrir le rapport d\'exception : montrer les lignes avec points manqués et dépassements de délai','Télécharger en Excel → montrer les 2 feuilles (sessions + points NFC)','Montrer la configuration du rapport automatique par email (quotidien / hebdomadaire)'],note:'Le rapport automatique par email permet aux superviseurs de recevoir les exceptions sans se connecter à l\'interface.'},
    nl: {context:'De site-manager wil de rondrapporten van de afgelopen 48 uur bekijken en controleren of er punten zijn gemist of vertragingen zijn opgetreden.',admin:['Zorg dat de route actief is en dat rondes zijn uitgevoerd (zie sr1)'],webchat:[],playout:['Admin → Mijn Tools → Routes → Rapporten','Filteren op route + datumbereik','Het uitzonderingsrapport openen: de regels tonen met gemiste punten en tijdoverschrijdingen','Downloaden als Excel → de 2 bladen tonen (sessies + NFC-punten)','De configuratie van het automatische e-mailrapport tonen (dagelijks / wekelijks)'],note:'Het automatische e-mailrapport stelt supervisors in staat uitzonderingen te ontvangen zonder in de interface in te loggen.'},
    en: {context:'The site manager wants to review patrol reports from the last 48 hours and check if any checkpoints were missed or time limits exceeded.',admin:['Ensure the route is active and that patrols have been carried out (see sr1)'],webchat:[],playout:['Admin → My Tools → Routes → Reports','Filter by route + date range','Open the exception report: show the lines with missed checkpoints and time overruns','Download as Excel → show the 2 sheets (sessions + NFC checkpoints)','Show the automatic email report configuration (daily / weekly)'],note:'The automatic email report allows supervisors to receive exceptions without logging into the interface.'},
  },
  "and1": {
    fr: {context:'Un responsable informatique doit déployer TOTR sur 50 téléphones avec la même configuration sans accès physique à chaque appareil.',admin:[],webchat:[],playout:['Sur l\'appareil maître : Plus > Paramètres > configurer tous les paramètres souhaités (PTI, géolocalisation, accessoires…)','Plus > Paramètres > Envoyer les paramètres → sélectionner les destinataires','Sur les appareils cibles : les paramètres sont reçus via TOTR et appliqués automatiquement','Montrer aussi : Plus > Paramètres > page par défaut → changer l\'onglet d\'accueil en \'Canaux\'','Montrer PTT Instant : dans Contacts, appuyer sur un contact → PTT démarre immédiatement'],note:'La fonctionnalité \'Envoyer les paramètres\' fonctionne aussi avec des appareils gérés par MDM. Les paramètres exportés incluent PTI, géo, beacon, audio, accessoires et réseau.'},
    nl: {context:'Een IT-verantwoordelijke moet TOTR op 50 telefoons uitrollen met dezelfde configuratie zonder fysieke toegang tot elk apparaat.',admin:[],webchat:[],playout:['Op het masterapparaat: Meer > Instellingen > alle gewenste parameters configureren (PTI, geolokalisatie, accessoires…)','Meer > Instellingen > Instellingen verzenden → ontvangers selecteren','Op de doelapparaten: de instellingen worden ontvangen via TOTR en automatisch toegepast','Ook tonen: Meer > Instellingen > standaardpagina → het startscherm wijzigen naar \'Kanalen\'','Direct PTT tonen: in Contacten op een contact drukken → PTT start onmiddellijk'],note:'De functie \'Instellingen verzenden\' werkt ook met MDM-beheerde apparaten. Geëxporteerde instellingen omvatten PTI, geo, beacon, audio, accessoires en netwerk.'},
    en: {context:'An IT manager needs to deploy TOTR on 50 phones with the same configuration without physical access to each device.',admin:[],webchat:[],playout:['On the master device: More > Settings > configure all desired parameters (LWP, geolocation, accessories…)','More > Settings > Send settings → select recipients','On target devices: settings are received via TOTR and applied automatically','Also show: More > Settings > default page → change the home tab to \'Channels\'','Show Instant PTT: in Contacts, tap a contact → PTT starts immediately'],note:'The \'Send settings\' feature also works with MDM-managed devices. Exported settings include LWP, geo, beacon, audio, accessories and network.'},

  "and2": {
    fr: {context:'Un technicien sur site industriel porte des gants et ne peut pas utiliser l\'écran tactile. Il doit quand même pouvoir déclencher un PTT ou une urgence.',admin:[],webchat:[],playout:['Sur Android : Plus > Paramètres > Accessoires → associer le bouton BLE (AINA ou autre)','Bouton 1 : assigner au canal PTT principal','Bouton 2 : assigner à l\'appel d\'urgence','Verrouiller l\'écran du téléphone de démo','Appuyer sur le bouton BLE → PTT se déclenche sans déverrouiller l\'écran','Appuyer longuement sur le bouton urgence → alerte envoyée'],note:'Compatible avec les terminaux Crosscall (Core M5 et autres). Le bouton urgence est configuré séparément du bouton PTT.'},
    nl: {context:'Een technicus op een industriële site draagt handschoenen en kan het aanraakscherm niet gebruiken. Hij moet toch een PTT of noodmelding kunnen activeren.',admin:[],webchat:[],playout:['Op Android: Meer > Instellingen > Accessoires → de BLE-knop koppelen (AINA of andere)','Knop 1: toewijzen aan het hoofd-PTT-kanaal','Knop 2: toewijzen aan de noodoproep','Het scherm van de demotelefoon vergrendelen','Op de BLE-knop drukken → PTT activeert zonder het scherm te ontgrendelen','Lang drukken op de noodknop → alert verzonden'],note:'Compatibel met Crosscall-terminals (Core M5 en andere). De noodknop wordt apart geconfigureerd van de PTT-knop.'},
    en: {context:'A technician on an industrial site is wearing gloves and cannot use the touchscreen. They still need to be able to trigger PTT or an emergency.',admin:[],webchat:[],playout:['On Android: More > Settings > Accessories → pair the BLE button (AINA or other)','Button 1: assign to the main PTT channel','Button 2: assign to the emergency call','Lock the screen of the demo phone','Press the BLE button → PTT triggers without unlocking the screen','Long-press the emergency button → alert sent'],note:'Compatible with Crosscall terminals (Core M5 and others). The emergency button is configured separately from the PTT button.'},
  },
  "and3": {
    fr: {context:'Un prospect utilise SOTI MobiControl ou Microsoft Intune. Il veut savoir si TOTR peut être déployé et configuré automatiquement via son MDM existant.',admin:[],webchat:[],playout:['Montrer le processus d\'inscription standard (sans MDM) : QR code au premier démarrage → 3 étapes de saisie manuelle','Montrer le flux MDM : l\'app est déjà installée et préconfigurée → aucune saisie manuelle nécessaire','Si Open ID (Entra ID) disponible : montrer la connexion SSO avec le compte Microsoft 365','Montrer que la langue peut être définie par MDM (français, néerlandais, anglais…)'],note:'L\'intégration MDM nécessite que le MDM fournisse OrgID, MSISDN, Token et FQDN à l\'application. Compatible avec SOTI MobiControl et Microsoft Intune. Confirmer la compatibilité technique avant de promettre au client.'},
    nl: {context:'Een prospect gebruikt SOTI MobiControl of Microsoft Intune. Hij wil weten of TOTR automatisch kan worden uitgerold en geconfigureerd via zijn bestaande MDM.',admin:[],webchat:[],playout:['Het standaard inschrijvingsproces tonen (zonder MDM): QR-code bij eerste start → 3 stappen handmatige invoer','De MDM-stroom tonen: de app is al geïnstalleerd en vooraf geconfigureerd → geen handmatige invoer nodig','Als Open ID (Entra ID) beschikbaar is: SSO-aanmelding tonen met het Microsoft 365-account','Tonen dat de taal via MDM kan worden ingesteld (Frans, Nederlands, Engels…)'],note:'MDM-integratie vereist dat de MDM OrgID, MSISDN, Token en FQDN aan de applicatie levert. Compatibel met SOTI MobiControl en Microsoft Intune. Technische compatibiliteit bevestigen vóór de belofte aan de klant.'},
    en: {context:'A prospect uses SOTI MobiControl or Microsoft Intune. They want to know if TOTR can be automatically deployed and configured via their existing MDM.',admin:[],webchat:[],playout:['Show the standard enrolment process (without MDM): QR code on first launch → 3 manual entry steps','Show the MDM flow: app is already installed and pre-configured → no manual entry needed','If Open ID (Entra ID) available: show SSO login with Microsoft 365 account','Show that language can be set by MDM (French, Dutch, English…)'],note:'MDM integration requires the MDM to supply OrgID, MSISDN, Token and FQDN to the application. Compatible with SOTI MobiControl and Microsoft Intune. Confirm technical compatibility before promising to the customer.'},

  "and4": {
    fr: {context:'Un dispatcher veut identifier rapidement sur la carte qui est en service, qui est en route vers un site, et quel rôle chaque agent joue.',admin:['Organisation → Utilisateurs → définir l\'icône de rôle pour chaque type d\'agent (ex. 🔧 Technicien, 🚗 Chauffeur)','Configurer les statuts opérationnels personnalisés (ex. En Route, Sur le site, En Pause)'],webchat:['WebChat → Carte → filtres de statut visibles'],playout:['Sur Android : agent change son statut de \'En Service\' à \'En Route\' depuis l\'app','Sur WebChat : le pin de l\'agent se met à jour immédiatement avec le nouveau statut','Montrer les icônes de rôle distinctes sur la carte','Dispatcher filtre la carte par statut \'En Service\' → seuls les agents disponibles apparaissent','Montrer le PLMN affiché dans les détails de l\'agent (quel opérateur réseau il utilise)'],note:'Android : le changement de statut peut être automatisé via des règles admin pour les prises/fins de poste.'},
    nl: {context:'Een dispatcher wil snel op de kaart zien wie in dienst is, wie onderweg is naar een locatie, en welke rol elke agent heeft.',admin:['Organisatie → Gebruikers → rolpictogram instellen voor elk type agent (bijv. 🔧 Technicus, 🚗 Chauffeur)','Aangepaste operationele statussen configureren (bijv. Onderweg, Op locatie, Op pauze)'],webchat:['WebChat → Kaart → statusfilters zichtbaar'],playout:['Op Android: agent verandert zijn status van \'In dienst\' naar \'Onderweg\' vanuit de app','Op WebChat: de pin van de agent wordt onmiddellijk bijgewerkt met de nieuwe status','De onderscheidende rolpictogrammen op de kaart tonen','Dispatcher filtert de kaart op status \'In dienst\' → alleen beschikbare agenten verschijnen','Toon het PLMN weergegeven in de agentgegevens (welk netwerkoperator hij gebruikt)'],note:'Android: de statuswijziging kan worden geautomatiseerd via admin-regels voor het begin/einde van dienst.'},
    en: {context:'A dispatcher wants to quickly see on the map who is on duty, who is en route to a site, and what role each agent plays.',admin:['Organisation → Users → set role icon for each agent type (e.g. 🔧 Technician, 🚗 Driver)','Configure custom operational statuses (e.g. En Route, On Site, On Break)'],webchat:['WebChat → Map → status filters visible'],playout:['On Android: agent changes their status from \'On Duty\' to \'En Route\' from the app','On WebChat: the agent\'s pin updates immediately with the new status','Show the distinctive role icons on the map','Dispatcher filters the map by \'On Duty\' status → only available agents appear','Show the PLMN displayed in the agent details (which network operator they are using)'],note:'Android: status change can be automated via admin rules for shift start/end.'},

  "adm1": {
    fr: {context:'L\'administrateur doit gérer 200 utilisateurs terrain avec des paramètres cohérents. Modifier un seul profil doit impacter tous les agents assignés instantanément.',admin:['Admin → Profils → Nouveau profil \'Agent terrain\'','Configurer : priorité PTT (1), mode suivi (Temps réel), PTI activé, droits My Business','Assigner 3 utilisateurs de démo à ce profil','Créer un second profil \'Dispatcher\' avec priorité PTT haute (3) et droits dispatch'],webchat:[],playout:['Montrer les deux profils dans Admin avec leurs paramètres différents','Modifier la priorité PTT du profil \'Agent terrain\' de 1 à 2','Sur les téléphones Android assignés : les paramètres sont mis à jour sans action de l\'utilisateur','Montrer le push de fichier de configuration : Profil → Envoyer la configuration → tous les mobiles reçoivent'],note:''},
    nl: {context:'De beheerder moet 200 veldgebruikers met consistente parameters beheren. Het wijzigen van één profiel moet alle toegewezen agenten onmiddellijk beïnvloeden.',admin:['Admin → Profielen → Nieuw profiel \'Veldagent\'','Configureren: PTT-prioriteit (1), trackingmodus (Realtime), PTI geactiveerd, My Business-rechten','3 demo-gebruikers aan dit profiel toewijzen','Een tweede profiel \'Dispatcher\' aanmaken met hoge PTT-prioriteit (3) en dispatch-rechten'],webchat:[],playout:['Beide profielen in Admin tonen met hun verschillende parameters','De PTT-prioriteit van het profiel \'Veldagent\' wijzigen van 1 naar 2','Op de toegewezen Android-telefoons: de parameters worden bijgewerkt zonder actie van de gebruiker','De push van configuratiebestand tonen: Profiel → Configuratie verzenden → alle mobiele apparaten ontvangen'],note:''},
    en: {context:'The administrator needs to manage 200 field users with consistent settings. Modifying a single profile must impact all assigned agents instantly.',admin:['Admin → Profiles → New profile \'Field Agent\'','Configure: PTT priority (1), tracking mode (Real-time), LWP enabled, My Business rights','Assign 3 demo users to this profile','Create a second profile \'Dispatcher\' with high PTT priority (3) and dispatch rights'],webchat:[],playout:['Show both profiles in Admin with their different parameters','Modify the PTT priority of the \'Field Agent\' profile from 1 to 2','On the assigned Android phones: settings update without any user action','Show config file push: Profile → Send configuration → all mobiles receive'],note:''},
  },
  "adm2": {
    fr: {context:'Une grande organisation multi-sites a besoin que chaque superviseur de site ne voit et ne gère que ses propres équipes.',admin:['Admin → Organisation → créer 2 départements (ex. Site Bruxelles, Site Liège)','Créer un superviseur par site et lui assigner uniquement son département','Ajouter des utilisateurs à chaque département'],webchat:[],playout:['Se connecter en tant que Superviseur Bruxelles → il ne voit que les utilisateurs de Bruxelles','Se connecter en tant qu\'Admin Organisation → il voit tous les utilisateurs de tous les sites','Montrer le tableau de bord d\'ajout rapide : créer un nouvel utilisateur en moins de 30 secondes','Montrer les groupes ad hoc (ex. \'Équipe projet\') qui traversent les départements'],note:''},
    nl: {context:'Een grote multi-site organisatie heeft nodig dat elke site-supervisor alleen zijn eigen teams ziet en beheert.',admin:['Admin → Organisatie → 2 afdelingen aanmaken (bijv. Site Brussel, Site Luik)','Een supervisor per site aanmaken en hem alleen zijn afdeling toewijzen','Gebruikers toevoegen aan elke afdeling'],webchat:[],playout:['Aanmelden als Supervisor Brussel → hij ziet alleen de gebruikers van Brussel','Aanmelden als Organisatiebeheerder → hij ziet alle gebruikers van alle sites','Het snelle toevoegdashboard tonen: een nieuwe gebruiker aanmaken in minder dan 30 seconden','Ad hoc groepen tonen (bijv. \'Projectteam\') die afdelingen overschrijden'],note:''},
    en: {context:'A large multi-site organisation needs each site supervisor to only see and manage their own teams.',admin:['Admin → Organisation → create 2 departments (e.g. Brussels Site, Liège Site)','Create a supervisor per site and assign them only their department','Add users to each department'],webchat:[],playout:['Log in as Brussels Supervisor → they only see Brussels users','Log in as Organisation Admin → they see all users from all sites','Show the quick-add dashboard: create a new user in under 30 seconds','Show ad hoc groups (e.g. \'Project Team\') that cross departments'],note:''},

const TAB_LABELS = {
  fr: {features:'📋 Fonctionnalités',demo:'🎬 Démo'},
  nl: {features:'📋 Functies',demo:'🎬 Demo'},
  en: {features:'📋 Features',demo:'🎬 Demo'},
};

const BL = {
  fr: {context:'🎯 Contexte',admin:'⚙️ Configuration Admin',webchat:'🖥️ Configuration WebChat',playout:'▶️ Déroulement',note:'📱 Note Android'},
  nl: {context:'🎯 Context',admin:'⚙️ Admin-configuratie',webchat:'🖥️ WebChat-configuratie',playout:'▶️ Verloop',note:'📱 Android-opmerking'},
  en: {context:'🎯 Context',admin:'⚙️ Admin setup',webchat:'🖥️ WebChat setup',playout:'▶️ Play-out',note:'📱 Android note'},
};

const NA_LABELS = {fr:'Aucune configuration admin requise.',nl:'Geen admin-configuratie vereist.',en:'No admin configuration required.'};
const NA_WEB_LABELS = {fr:'Aucune configuration WebChat requise.',nl:'Geen WebChat-configuratie vereist.',en:'No WebChat configuration required.'};


function makeDemoHTML(id, lang) {
  if (!DEMO_DATA[id]) return '';
  const d = DEMO_DATA[id][lang];
  if (!d) return '';
  const bl = BL[lang];
  let h = '';
  if (d.context) {
    h += '<div class="demo-block"><div class="demo-block-head">' + bl.context + '</div>';
    h += '<p style="font-size:12px;color:var(--text2);line-height:1.6;margin:0">' + d.context + '</p></div>';
  }
  // Admin
  h += '<div class="demo-block"><div class="demo-block-head">' + bl.admin + '</div>';
  if (d.admin && d.admin.length) {
    h += '<ol class="demo-steps">';
    d.admin.forEach((s,i) => { h += '<li data-n="'+(i+1)+'">' + s + '</li>'; });
    h += '</ol>';
  } else {
    h += '<p style="font-size:12px;color:var(--text3);font-style:italic;margin:0">' + NA_LABELS[lang] + '</p>';
  }
  h += '</div>';
  // WebChat
  h += '<div class="demo-block"><div class="demo-block-head">' + bl.webchat + '</div>';
  if (d.webchat && d.webchat.length) {
    h += '<ol class="demo-steps">';
    d.webchat.forEach((s,i) => { h += '<li data-n="'+(i+1)+'">' + s + '</li>'; });
    h += '</ol>';
  } else {
    h += '<p style="font-size:12px;color:var(--text3);font-style:italic;margin:0">' + NA_WEB_LABELS[lang] + '</p>';
  }
  h += '</div>';
  // Playout
  if (d.playout && d.playout.length) {
    h += '<div class="demo-block"><div class="demo-block-head">' + bl.playout + '</div>';
    h += '<ol class="demo-steps">';
    d.playout.forEach((s,i) => { h += '<li data-n="'+(i+1)+'">' + s + '</li>'; });
    h += '</ol></div>';
  }
  if (d.note) {
    h += '<div class="demo-note"><strong>' + bl.note + ' :</strong> ' + d.note + '</div>';
  }
  return h;
}

function switchTab(panelId, tab) {
  const panel = document.getElementById(panelId);
  if (!panel) return;
  panel.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  panel.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.dataset.tab === tab));
}


function openDetail(id, h3, bullets, tip, anote) {
  const card = document.getElementById('card-'+id);
  if (!card) return;
  const section = card.closest('.section');
  const placeholder = section.querySelector('.detail');
  if (openCard === id) {
    placeholder.classList.remove('open');
    card.classList.remove('active');
    openCard = null;
    return;
  }
  document.querySelectorAll('.detail.open').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.card.active').forEach(c => c.classList.remove('active'));
  
  const tl = TAB_LABELS[currentLang];
  const featContent = '<h3>' + h3 + '</h3><ul>' + bullets + '</ul>' + tip + anote;
  const demoContent = makeDemoHTML(id, currentLang);
  const panelId = 'panel-' + id;
  
  let tabBar = '<div class="tab-bar">';
  tabBar += '<button class="tab-btn active" data-tab="features" onclick="switchTab(\''+panelId+'\',\'features\')">' + tl.features + '</button>';
  if (demoContent) {
    tabBar += '<button class="tab-btn" data-tab="demo" onclick="switchTab(\''+panelId+'\',\'demo\')">' + tl.demo + '</button>';
  }
  tabBar += '</div>';
  
  placeholder.innerHTML = '<div id="' + panelId + '">' + tabBar +
    '<div class="tab-pane active" data-tab="features">' + featContent + '</div>' +
    (demoContent ? '<div class="tab-pane" data-tab="demo">' + demoContent + '</div>' : '') +
    '</div>';
  
  placeholder.classList.add('open');
  card.classList.add('active');
  openCard = id;
  setTimeout(() => placeholder.scrollIntoView({behavior:'smooth', block:'nearest'}), 60);
}

function toggleSection(si) {
  const grid = document.getElementById('grid'+si);
  const chevron = document.getElementById('ch'+si);
  if (!grid) return;
  const isOpen = grid.style.display !== 'none';
  grid.style.display = isOpen ? 'none' : 'grid';
  chevron.classList.toggle('open', !isOpen);
  if (isOpen) {
    document.querySelectorAll(`#s${si} .detail.open`).forEach(d => d.classList.remove('open'));
  }
}

// Initial render
renderAll();
</script>
